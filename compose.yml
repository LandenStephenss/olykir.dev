services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    image: olykir-nextjs
    container_name: olykir-nextjs
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    networks:
      - shared-proxy

networks:
  shared-proxy:
    external: true